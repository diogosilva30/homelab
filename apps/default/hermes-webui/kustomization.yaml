apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests/ingress.yaml
  - manifests/tunnel-binding.yaml

replacements:
  - source:
      kind: Ingress
      name: hermes-webui
      fieldPath: metadata.annotations.external_dns
    targets:
      - select:
          kind: Ingress
          name: hermes-webui
        fieldPaths:
          - spec.rules.0.host
        options:
          delimiter: "."
          index: 1
      - select:
          kind: TunnelBinding
          name: hermes-webui-tunnel-binding
        fieldPaths:
          - subjects.0.spec.fqdn
        options:
          delimiter: "."
          index: 1

patches:
  - target:
      version: v1
      kind: Ingress
      name: hermes-webui
      annotationSelector: external-dns.alpha.kubernetes.io/target
    patch: |-
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
